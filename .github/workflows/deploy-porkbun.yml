name: Build and publish static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable the pinned pnpm release
        run: corepack enable pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build public files
        run: pnpm build

      - name: Validate public files
        run: pnpm validate:build

      - name: Upload validated site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: porkbun-site
          path: dist/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    name: Update production branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          fetch-depth: 0
          path: publish

      - name: Download validated site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: porkbun-site
          path: site

      - name: Confirm required artifact entry points
        run: |
          test -s site/index.html
          test -s site/intro/index.html
          test ! -e site/dist
          if find site -type l -print -quit | grep -q .; then
            echo "The publication artifact contains a symbolic link." >&2
            exit 1
          fi

      - name: Synchronize public files
        run: rsync -a --delete --exclude=.git site/ publish/

      - name: Commit and publish changed output
        working-directory: publish
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Generated output is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${GITHUB_SHA}"
          git push origin HEAD:production
